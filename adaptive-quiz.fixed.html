            return explanations[((localIndex >= 0 ? localIndex : qIndex)) % explanations.length];
        }
        return explanations[qIndex % explanations.length];

    function loadQuestion() {
        if (state.currentIndex >= state.questions.length) { endQuiz(); return; }
        const q = state.questions[state.currentIndex];
        state.answered = false;

        // Reset UI
        document.getElementById('aq-feedback').style.display = 'none';
        document.getElementById('aq-ai-tutor').style.display = 'none';
        document.getElementById('aq-hint-box').style.display = 'none';
        document.getElementById('aq-hint-btn').style.display = 'flex';
        document.getElementById('aq-next-btn').disabled = true;
        document.getElementById('aq-skip-btn').disabled = false;

        // Progress
        const pct = (state.currentIndex / state.questions.length) * 100;
        document.getElementById('qhb-progress-fill').style.width = pct + '%';
        document.getElementById('qhb-progress-label').textContent = `${state.currentIndex + 1} / ${state.questions.length}`;
        document.getElementById('aq-q-number').textContent = `سؤا� | Question ${state.currentIndex + 1}`;
        document.getElementById('qhb-streak').textContent = state.streak;
        document.getElementById('qhb-xp').textContent = state.xp;

        // Difficulty
        const dl = Math.max(1, Math.min(4, state.difficultyLevel));
        document.getElementById('diff-label').textContent = diffLabels[dl];
        document.getElementById('diff-label').style.color = diffColors[dl];
        for (let i = 1; i <= 4; i++) {
            document.getElementById('dd-' + i).className = 'diff-dot' + (i <= dl ? ' active' : '');
        }

        // Topic chip
        document.getElementById('topic-chip').innerHTML = getTopicLabel(q);

        // Question text
        document.getElementById('aq-question-text').textContent = q.question;

        // Hint
        document.getElementById('aq-hint-text').textContent = getHint(q, state.currentIndex);

        const area = document.getElementById('aq-answer-area');
        area.innerHTML = '';
        const optContainer = document.createElement('div');
        optContainer.className = 'aq-options';

        q.options.forEach((opt, i) => {
            const btn = document.createElement('button');
            btn.className = 'aq-option-btn';
            btn.setAttribute('data-index', i);
            btn.innerHTML = `
                <span class="aq-opt-letter">${String.fromCharCode(65 + i)}</span>
                <span class="aq-opt-text">${opt}</span>
                <span class="aq-opt-indicator"></span>
            `;
            btn.addEventListener('click', () => selectAnswer(i, btn, optContainer, q));

        state.answered = true;
        clearInterval(state.timerInterval);
        document.getElementById('aq-skip-btn').disabled = true;

        const isCorrect = index === q.correctAnswer;

            state.xp += earned;
            showXPPop(earned);
            if (state.correctStreak >= 3) { state.difficultyLevel = Math.min(4, state.difficultyLevel + 1); state.correctStreak = 0; }
        } else {
            state.streak = 0;
            state.wrongStreak++;
            state.correctStreak = 0;
            if (state.wrongStreak >= 2) { state.difficultyLevel = Math.max(1, state.difficultyLevel - 1); state.wrongStreak = 0; }
        }

        state.userAnswers.push({
            questionIndex: state.currentIndex,
            question: q.question,
            options: q.options,
            userAnswer: index,
            correctAnswer: q.correctAnswer,
            isCorrect,
            topic: q.topic || 'virtual-env'
        });

        showFeedback(isCorrect, q);
        setTimeout(() => showAITutor(state.currentIndex, isCorrect, q), 600);
        document.getElementById('aq-next-btn').disabled = false;
    }

    // ������������������������������������������������������������������������������������������
    // Feedback (bilingual)
    // ������������������������������������������������������������������������������������������
    function showFeedback(isCorrect, q) {
        const fb = document.getElementById('aq-feedback');
        const icon = document.getElementById('aq-feedback-icon');
        const title = document.getElementById('aq-feedback-title');
        const text = document.getElementById('aq-feedback-text');

        fb.className = 'aq-feedback ' + (isCorrect ? 'fb-correct' : 'fb-wrong');
        icon.innerHTML = isCorrect ? '<i class="fas fa-check-circle"></i>' : '<i class="fas fa-times-circle"></i>';

        if (isCorrect) {
            title.textContent = '�S& �&�&تاز! Correct! Well done!';
            text.textContent = `أحس� ت! �x� س�س�ة ${state.streak} إجابات صح�`حة! | Great! You're on a ${state.streak} question streak!`;
        } else {
            title.textContent = '�R إجابة خاطئة | Incorrect � �� تع��& �&�  �!ذا!';
            text.textContent = `ا�إجابة ا�صح�`حة �!�` | Correct answer: "${q.options[q.correctAnswer]}"`;
        }

        fb.style.display = 'flex';
        fb.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    // ������������������������������������������������������������������������������������������
    // AI Tutor (bilingual typing effect)
    // ������������������������������������������������������������������������������������������
    function showAITutor(qIndex, isCorrect, q) {
        const tutor = document.getElementById('aq-ai-tutor');
        const msg = document.getElementById('ai-tutor-message');
        const typingLabel = document.getElementById('ai-typing-label');
        const stepsContainer = document.getElementById('ai-step-by-step');
        const stepsList = document.getElementById('ai-steps-list');
        const stepTitle = stepsContainer.querySelector('h5');

        tutor.style.display = 'block';
        typingLabel.textContent = '�x� ا��&ع��& ا�ذْ�` �`فْر... | AI Tutor is thinking...';
        msg.textContent = '';
        stepsContainer.style.display = 'none';
        if (stepTitle) stepTitle.innerHTML = '<i class="fas fa-list-ol"></i> خط��ات ا�تفس�`ر | Step-by-Step Explanation';

        const explanation = getExplanation(q, qIndex);

        const prefix = isCorrect
            ? '�S& إجابة صح�`حة! | Correct! '
            : '�xR تفس�`ر ا�إجابة ا�صح�`حة | Explanation: ';

        const fullMsg = prefix + explanation.message;

        let i = 0;
        typingLabel.textContent = '�R�️ �`ْتب... | Typing...';

        const typeInterval = setInterval(() => {
            msg.textContent += fullMsg[i];
            i++;
            if (i >= fullMsg.length) {
                clearInterval(typeInterval);
                typingLabel.textContent = '�x� ا��&ع��& ا�ذْ�` | AI Tutor';

                if (explanation.steps) {
                    stepsContainer.style.display = 'block';
                    stepsList.innerHTML = explanation.steps.map(s =>
                        `<li style="margin-bottom:6px;line-height:1.7">${s}</li>`
                    ).join('');
                }
            }
        }, 14);

        tutor.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    // ������������������������������������������������������������������������������������������
    // Hint (bilingual)
    // ������������������������������������������������������������������������������������������
    function showHint() {
        const hintBox = document.getElementById('aq-hint-box');
        hintBox.style.display = 'flex';
        document.getElementById('aq-hint-btn').style.display = 'none';
        state.hintsUsed++;
    }

    function skipQuestion() {
        if (state.answered) return;
        clearInterval(state.timerInterval);
        state.streak = 0;
        state.skipsUsed++;
        const q = state.questions[state.currentIndex];
        state.userAnswers.push({
            questionIndex: state.currentIndex,
            question: q.question,
            options: q.options,
            userAnswer: null,
            correctAnswer: q.correctAnswer,
            isCorrect: false,
            topic: q.topic || 'virtual-env'
        });
        state.currentIndex++;
        loadQuestion();
    }

    function nextQuestion() {
        state.currentIndex++;
        loadQuestion();
    }

    function startTimer() {
        const totalTime = config.timer === 0 ? 999 : (config.timer || 30);
        let timeLeft = totalTime;
        document.getElementById('timer-seconds').textContent = totalTime === 999 ? '��~' : totalTime;
        const ring = document.getElementById('timer-ring-fill');
        const circumference = 94;
        ring.style.strokeDashoffset = '0';
        ring.style.stroke = '#6c63ff';
        if (totalTime === 999) return;

        clearInterval(state.timerInterval);
        state.timerInterval = setInterval(() => {
            timeLeft--;
            document.getElementById('timer-seconds').textContent = timeLeft;
            const offset = circumference - (timeLeft / totalTime) * circumference;
            ring.style.strokeDashoffset = offset;
            if (timeLeft <= 10) ring.style.stroke = '#ef4444';
            else if (timeLeft <= 20) ring.style.stroke = '#f7931e';

            if (timeLeft <= 0) {
                clearInterval(state.timerInterval);
                if (!state.answered) {
                    const q = state.questions[state.currentIndex];
                    state.streak = 0;
                    state.userAnswers.push({ questionIndex: state.currentIndex, question: q.question, options: q.options, userAnswer: null, correctAnswer: q.correctAnswer, isCorrect: false, topic: q.topic || 'virtual-env' });
                    document.getElementById('aq-question-card').querySelectorAll('.aq-option-btn').forEach(b => b.classList.add('disabled'));
                    const fb = document.getElementById('aq-feedback');
                    fb.className = 'aq-feedback fb-timeout';
                    document.getElementById('aq-feedback-icon').innerHTML = '<i class="fas fa-hourglass-end"></i>';
                    document.getElementById('aq-feedback-title').textContent = '⏱️ ا� ت�!�0 ا����ت! | Time\'s Up!';
                    document.getElementById('aq-feedback-text').textContent = 'ا�إجابة ا�صح�`حة | Correct answer: "' + q.options[q.correctAnswer] + '"';
                    fb.style.display = 'flex';
                    state.answered = true;
                    document.getElementById('aq-next-btn').disabled = false;
                    setTimeout(() => showAITutor(state.currentIndex, false, q), 600);
                }
            }
        }, 1000);
    }

    function showXPPop(amount) {
        const pop = document.getElementById('xp-pop');
        document.getElementById('xp-pop-val').textContent = amount;
        pop.style.display = 'block';
        pop.style.opacity = '1';
        pop.style.transform = 'translateX(-50%) translateY(0)';
        setTimeout(() => {
            pop.style.opacity = '0';
            pop.style.transform = 'translateX(-50%) translateY(-40px)';
            setTimeout(() => pop.style.display = 'none', 400);
        }, 800);
    }

    function endQuiz() {
        clearInterval(state.timerInterval);
        const timeTaken = Math.round((Date.now() - state.sessionStart) / 1000);
        const user = JSON.parse(localStorage.getItem('eduai_current_user') || '{}');
        user.xp = (user.xp || 0) + state.xp;
        user.streak = Math.max(user.streak || 0, state.streak);
        if (!user.badges) user.badges = [];
        if (state.score === state.questions.length && !user.badges.includes('perfect')) user.badges.push('perfect');
        if (state.maxStreak >= 5 && !user.badges.includes('streak_5')) user.badges.push('streak_5');
        localStorage.setItem('eduai_current_user', JSON.stringify(user));

        const results = {
            studentName: user.name || 'Student',
            studentCode: user.email || '�',
            score: state.score,
            totalQuestions: state.questions.length,
            userAnswers: state.userAnswers,
            xpEarned: state.xp,
            maxStreak: state.maxStreak,
            timeTaken,
            hintsUsed: state.hintsUsed,
            skipsUsed: state.skipsUsed,
            adaptiveMode: true
        };
        sessionStorage.setItem('quizResults', JSON.stringify(results));
        localStorage.setItem('latestQuizResults', JSON.stringify(results));
        setTimeout(() => { window.location.href = 'results.html'; }, 300);
    }

    function confirmExit() { document.getElementById('exit-modal').style.display = 'flex'; }
    function exitToQuiz() { clearInterval(state.timerInterval); window.location.href = 'dashboard.html'; }

    // Boot
    prepareQuestions();
    loadQuestion();

    window.addEventListener('beforeunload', (e) => {
        if (state.currentIndex > 0 && state.currentIndex < state.questions.length) {
            e.preventDefault(); e.returnValue = '';
        }
    });
    </script>
