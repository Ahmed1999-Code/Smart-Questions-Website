<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found – EduAI Pro</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="stylesheet" href="platform.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        .nf { min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
              text-align:center; padding:24px; }
        .nf i { font-size:4rem; color:var(--primary,#6d28d9); margin-bottom:16px; }
        .nf h1 { font-size:5rem; margin:0; line-height:1; }
        .nf h2 { margin:8px 0 8px; }
        .nf p { color:var(--text3,#888); max-width:420px; }
    </style>
</head>
<body>
    <div class="nf">
        <i class="fas fa-compass"></i>
        <h1>404</h1>
        <h2>We couldn't find that page</h2>
        <p>The page may have moved, or the link may be broken. Let's get you back on track.</p>
        <p>
            <a class="btn-auth-submit" href="index.html" style="display:inline-block;text-decoration:none;padding:12px 24px;">
                <i class="fas fa-home"></i> Back to Home
            </a>
        </p>
    </div>
</body>
</html>
