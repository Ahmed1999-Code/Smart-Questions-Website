# Netlify configuration — EduAI Pro
# Provides security headers + clean routes. Netlify serves the repo root as-is
# (no build step). Equivalent configs for Cloudflare Pages / Vercel are included
# in public/_headers and vercel.json.

[build]
  publish = "."

# Netlify automatically serves /404.html for unknown paths (no redirect needed),
# which avoids masking real 200s. Same behaviour on Cloudflare Pages and Vercel.

# ---- Security headers -------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Cross-Origin-Opener-Policy = "same-origin"
    # NOTE: 'unsafe-inline' is required until the inline scripts/styles are
    # externalised. Tighten to nonces/hashes in a later phase.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://cdn.jsdelivr.net; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"

# Never cache the exposed-secrets legacy file even if left on disk.
[[headers]]
  for = "/Link This Website/*"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex, nofollow"
