    <style>
    /* Custom Interactive Question Types CSS */
    .aq-input-text { width: 100%; padding: 14px; border-radius: 10px; border: 1.5px solid var(--border); background: var(--bg3); color: var(--text); font-family: var(--font-main); font-size: 1rem; outline: none; margin-bottom: 20px; transition: border 0.3s; }
    .aq-input-text:focus { border-color: var(--primary); }
    .aq-textarea { width: 100%; min-height: 120px; padding: 14px; border-radius: 10px; border: 1.5px solid var(--border); background: var(--bg3); color: var(--text); font-family: var(--font-main); font-size: 1rem; outline: none; resize: vertical; margin-bottom: 20px; transition: border 0.3s; }
    .aq-textarea:focus { border-color: var(--primary); }
    .aq-code-editor { font-family: var(--font-code); background: #0d0f1a; color: #a855f7; border-left: 3px solid var(--primary); padding: 16px; min-height: 150px; direction: ltr; }
    .aq-submit-btn { width: 100%; padding: 12px 24px; border-radius: 10px; border: none; background: linear-gradient(135deg, var(--primary), var(--primary2)); color: white; font-size: 1rem; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 4px 15px rgba(108,99,255, 0.4); transition: transform 0.2s; margin-top: 10px; }
    .aq-submit-btn:hover { transform: translateY(-3px); }
    .aq-submit-btn:disabled { opacity: 0.6; cursor: not-allowed; }
    /* Drag & Drop */
    .aq-drag-container { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
    .aq-drag-item { background: var(--card2); border: 1px solid var(--border); padding: 12px; border-radius: 8px; cursor: grab; display: flex; align-items: center; gap: 10px; color: var(--text); font-weight: 500; }
    .aq-drag-item:active { cursor: grabbing; }
    /* Matching */
    .aq-match-row { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; margin-bottom: 12px; gap: 10px; background: var(--bg3); padding: 12px; border-radius: 10px; border: 1px solid var(--border); }
    .aq-match-left { flex: 1; font-weight: 600; color: var(--text); min-width: 200px; }
    .aq-match-right { flex: 1; min-width: 200px; display: flex; }
    .aq-match-select { width: 100%; padding: 10px; border-radius: 8px; background: var(--card); color: var(--text); border: 1px solid var(--border); outline: none; cursor: pointer; }
    /* Context Box */
    .aq-context-box { background: rgba(108, 99, 255, 0.08); border-right: 4px solid var(--primary); padding: 16px; margin-bottom: 20px; border-radius: 10px 0 0 10px; color: var(--text2); font-size: 0.95rem; line-height: 1.6; text-align: right; }
    .aq-context-box h4 { color: var(--text); margin-bottom: 8px; }
    .aq-sub-qs { margin-bottom: 15px; font-weight: bold; color: var(--text); text-align: right; }
    </style>

<body class="quiz-body">

    <!-- Quiz Header -->
    <header class="quiz-header-bar">
        <div class="qhb-left">
            <button class="qhb-back-btn" onclick="confirmExit()"><i class="fas fa-times"></i></button>
            <div class="qhb-brand"><i class="fas fa-brain"></i> EduAI Pro</div>
        </div>
        <div class="qhb-center">
            <div class="qhb-progress">
                <div class="qhb-progress-bar">
                    <div class="qhb-progress-fill" id="qhb-progress-fill" style="width:0%"></div>
                </div>
                <span class="qhb-progress-label" id="qhb-progress-label">0 / 0</span>

        </div>

                    <svg viewBox="0 0 36 36">
                        <circle class="timer-track" cx="18" cy="18" r="15"/>
                        <circle class="timer-fill" id="timer-ring-fill" cx="18" cy="18" r="15"
                            stroke-dasharray="94" stroke-dashoffset="0"/>
                    </svg>
                    <span id="timer-seconds">30</span>
                </div>
            </div>
        </div>
    </header>

    <!-- Difficulty Indicator -->
    <div class="difficulty-bar" id="difficulty-bar">

            <i class="fas fa-signal"></i>

            <span class="diff-dot" id="dd-3" title="Advanced"></span>
            <span class="diff-dot" id="dd-4" title="Expert"></span>
        </div>
        <div class="topic-chip" id="topic-chip"><i class="fas fa-tag"></i> Virtual Environments</div>
    </div>

    <!-- Main Quiz Area -->
    <main class="aq-main" id="aq-main">

        <!-- Question Card -->
        <div class="aq-question-card" id="aq-question-card">

            <!-- Question Meta -->
            <div class="aq-q-meta" id="aq-q-meta">
                <span class="aq-q-number" id="aq-q-number">Question 1</span>
                <span class="aq-q-type-badge" id="aq-q-type-badge"><i class="fas fa-list-ul"></i> MCQ</span>
                <span class="aq-q-time-est" id="aq-q-time-est"><i class="fas fa-clock"></i> ~30s</span>
            </div>

            <!-- Question Text -->
            <div class="aq-question-text" id="aq-question-text"></div>

            <!-- Hint Button -->
            <button class="aq-hint-btn" id="aq-hint-btn" onclick="showHint()">
                <i class="fas fa-lightbulb"></i> Show Hint
            </button>
            <div class="aq-hint-box" id="aq-hint-box" style="display:none">
                <i class="fas fa-lightbulb"></i>
                <p id="aq-hint-text"></p>
            </div>

            <!-- Answer Area (changes by type) -->
            <div class="aq-answer-area" id="aq-answer-area"></div>

            <!-- Feedback Area -->
            <div class="aq-feedback" id="aq-feedback" style="display:none">
                <div class="aq-feedback-icon" id="aq-feedback-icon"></div>
                <div class="aq-feedback-content">
                    <h4 id="aq-feedback-title"></h4>
                    <p id="aq-feedback-text"></p>
                </div>
            </div>

            <!-- AI Tutor -->
            <div class="aq-ai-tutor" id="aq-ai-tutor" style="display:none">
                <div class="ai-tutor-header">
                    <div class="ai-tutor-avatar"><i class="fas fa-robot"></i></div>
                    <div>
                        <h4>AI Tutor</h4>
                        <span class="ai-typing-label" id="ai-typing-label">Thinking...</span>
                    </div>
                </div>
                <div class="ai-tutor-message" id="ai-tutor-message"></div>
                <div class="ai-step-by-step" id="ai-step-by-step" style="display:none">
                    <h5><i class="fas fa-list-ol"></i> Step-by-Step Explanation</h5>
                    <ol class="ai-steps-list" id="ai-steps-list"></ol>
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="aq-actions" id="aq-actions">
                <button class="aq-skip-btn" id="aq-skip-btn" onclick="skipQuestion()">
                    <i class="fas fa-forward"></i> Skip
                </button>
                <button class="aq-next-btn" id="aq-next-btn" disabled onclick="nextQuestion()">
                    Next <i class="fas fa-chevron-right"></i>
                </button>
            </div>
        </div>

    </main>

    <!-- XP Pop animation -->
    <div class="xp-pop" id="xp-pop" style="display:none">+<span id="xp-pop-val">10</span> XP</div>

    // â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
    // Get explanation for a question
    // â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
    function getExplanation(q, qIndex) {
        const topic = q.topic || 'virtual-env';
        const explanations = aiExplanationsByTopic[topic] || aiExplanationsByTopic['virtual-env'];

        // If cybersecurity, match by topic-specific index based on the question's position among cyber questions
        if (topic === 'cybersecurity') {
            const cyberQs = state.questions.filter(x => x.topic === 'cybersecurity');
            const localIndex = cyberQs.indexOf(q);
            return explanations[((localIndex >= 0 ? localIndex : qIndex)) % explanations.length];
        }
        return explanations[qIndex % explanations.length];
    }

    // â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
    // Get hint for a question
    // â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
    function getHint(q, qIndex) {
        const topic = q.topic || 'virtual-env';
        const hintList = topicHints[topic] || topicHints['virtual-env'];
        return hintList[qIndex % hintList.length];
    }

    // â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
    // Detect topic chip label
    // â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
    function getTopicLabel(q) {
        if (!q.topic || q.topic === 'virtual-env') {
            const envTopics = ['البيئات الافتراضية', 'إدارة الحزم', 'أوامر pip', 'Conda & Pipenv', 'إعدادات متقدمة'];
            return `<i class="fas fa-snake" style="color:#f7931e"></i> ${envTopics[state.currentIndex % envTopics.length]}`;
        }
        if (q.topic === 'cybersecurity') {
            return `<i class="fas fa-shield-alt" style="color:#ef4444"></i> 🔐 الأمن السيبراني | Cybersecurity`;
        }
        return `<i class="fas fa-tag"></i> ${q.topic}`;
    }

    // â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
    // Prepare questions (with optional topic filter)
    // â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
    function prepareQuestions() {
        let all = [...quizQuestions];
        
        // Filter by user selected question type from dashboard settings
        if (config.type && config.type !== 'all') {
            if (config.type === 'mcq') {
                all = all.filter(q => !q.type || q.type === 'mcq');
            } else {
                all = all.filter(q => q.type === config.type);
            }
        }
        
        let complexQs = all.filter(q => q.type && q.type !== 'mcq');
        let mcqQs = all.filter(q => !q.type || q.type === 'mcq').sort(() => Math.random() - 0.5);
        
        // Put complex questions first so they are immediately visible
        all = [...complexQs, ...mcqQs];

        const numQ = config.num === 'all' ? all.length : Math.min(parseInt(config.num) || 20, all.length);
        state.questions = all.slice(0, numQ);
    }

    // â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
    // Load question
    // â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
    function loadQuestion() {
        if (state.currentIndex >= state.questions.length) { endQuiz(); return; }
        const q = state.questions[state.currentIndex];
        state.answered = false;

        // Reset UI
        document.getElementById('aq-feedback').style.display = 'none';
        document.getElementById('aq-ai-tutor').style.display = 'none';
        document.getElementById('aq-hint-box').style.display = 'none';
        document.getElementById('aq-hint-btn').style.display = 'flex';
        document.getElementById('aq-next-btn').disabled = true;
        document.getElementById('aq-skip-btn').disabled = false;

        // Progress
        const pct = (state.currentIndex / state.questions.length) * 100;
        document.getElementById('qhb-progress-fill').style.width = pct + '%';
        document.getElementById('qhb-progress-label').textContent = `${state.currentIndex + 1} / ${state.questions.length}`;
        document.getElementById('aq-q-number').textContent = `سؤال | Question ${state.currentIndex + 1}`;
        document.getElementById('qhb-streak').textContent = state.streak;
        document.getElementById('qhb-xp').textContent = state.xp;

        // Difficulty
        const dl = Math.max(1, Math.min(4, state.difficultyLevel));
        document.getElementById('diff-label').textContent = diffLabels[dl];
        document.getElementById('diff-label').style.color = diffColors[dl];
        for (let i = 1; i <= 4; i++) {
            document.getElementById('dd-' + i).className = 'diff-dot' + (i <= dl ? ' active' : '');
        }

        // Topic chip
        document.getElementById('topic-chip').innerHTML = getTopicLabel(q);

        // Question text
        document.getElementById('aq-question-text').textContent = q.question;

        // Hint
        document.getElementById('aq-hint-text').textContent = getHint(q, state.currentIndex);

        // Render options based on type
        const area = document.getElementById('aq-answer-area');
        area.innerHTML = '';

        const typeIcons = {
            'mcq': '<i class="fas fa-list-ul"></i> MCQ',
            'fill-blank': '<i class="fas fa-pen"></i> Fill Blank',
            'coding': '<i class="fas fa-code"></i> Coding',
            'essay': '<i class="fas fa-align-left"></i> Essay',
            'drag-drop': '<i class="fas fa-arrows-alt"></i> Drag & Drop',
            'matching': '<i class="fas fa-random"></i> Matching',
            'case-study': '<i class="fas fa-briefcase"></i> Case',
            'simulation': '<i class="fas fa-gamepad"></i> Sim'
        };
        const currentType = q.type || 'mcq';
        document.getElementById('aq-q-type-badge').innerHTML = typeIcons[currentType] || typeIcons['mcq'];

        if (currentType === 'mcq') {
            const optContainer = document.createElement('div');
            optContainer.className = 'aq-options';

            q.options.forEach((opt, i) => {
                const btn = document.createElement('button');
                btn.className = 'aq-option-btn';
                btn.setAttribute('data-index', i);
                btn.innerHTML = `
                    <span class="aq-opt-letter">${String.fromCharCode(65 + i)}</span>
                    <span class="aq-opt-text">${opt}</span>
                    <span class="aq-opt-indicator"></span>
                `;
                btn.addEventListener('click', () => selectAnswer(i, btn, optContainer, q));
                optContainer.appendChild(btn);
            });
            area.appendChild(optContainer);
        } else if (currentType === 'fill-blank') {
            const input = document.createElement('input');
            input.type = 'text';
            input.className = 'aq-input-text';
            input.placeholder = 'اكتب إجابتك هنا... | Type your answer here...';
            area.appendChild(input);
            const submitBtn = document.createElement('button');
            submitBtn.className = 'aq-submit-btn';
            submitBtn.innerHTML = '<i class="fas fa-paper-plane"></i> إرسال الإجابة | Submit Answer';
            submitBtn.onclick = () => processComplexAnswer(input.value.trim(), submitBtn, input, q);
            area.appendChild(submitBtn);
        } else if (currentType === 'coding') {
            const textarea = document.createElement('textarea');
            textarea.className = 'aq-textarea aq-code-editor';
            textarea.placeholder = '# اكتب الكود الخاص بك هنا... | Write your code here...';
            area.appendChild(textarea);
            const submitBtn = document.createElement('button');
            submitBtn.className = 'aq-submit-btn';
            submitBtn.innerHTML = '<i class="fas fa-play"></i> تشغيل الكود | Run Code';
            submitBtn.onclick = () => processComplexAnswer(textarea.value.trim(), submitBtn, textarea, q);
            area.appendChild(submitBtn);
        } else if (currentType === 'essay') {
            const textarea = document.createElement('textarea');
            textarea.className = 'aq-textarea';
            textarea.placeholder = 'اكتب الشرح هنا... | Write your explanation here...';
            area.appendChild(textarea);
            const submitBtn = document.createElement('button');
            submitBtn.className = 'aq-submit-btn';
            submitBtn.innerHTML = '<i class="fas fa-paper-plane"></i> إرسال المقال | Submit Essay';
            submitBtn.onclick = () => processComplexAnswer(textarea.value.trim(), submitBtn, textarea, q);
            area.appendChild(submitBtn);
        } else if (currentType === 'drag-drop') {
            const container = document.createElement('div');
            container.className = 'aq-drag-container';
            // Show options to user; Mocking drag functionality by sorting randomly for user to mentally order, then clicking submit to "approve"
            [...(q.options||[])].sort(()=>Math.random() - 0.5).forEach((opt, i) => {
                const item = document.createElement('div');
                item.className = 'aq-drag-item';
                item.innerHTML = `<i class="fas fa-grip-lines"></i> ${opt}`;
                container.appendChild(item);
            });
            area.appendChild(container);
            const submitBtn = document.createElement('button');
            submitBtn.className = 'aq-submit-btn';
            submitBtn.innerHTML = '<i class="fas fa-check"></i> تأكيد الترتيب | Submit Order';
            submitBtn.onclick = () => processComplexAnswer(q.options, submitBtn, container, q);
            area.appendChild(submitBtn);
        } else if (currentType === 'matching') {
            const container = document.createElement('div');
            const rightOptions = [...(q.correctAnswer||[])].sort(() => Math.random() - 0.5);
            (q.pairs||[]).forEach(pair => {
                const row = document.createElement('div');
                row.className = 'aq-match-row';
                const selectBox = document.createElement('select');
                selectBox.className = 'aq-match-select';
                selectBox.innerHTML = `<option value="">-- اختر الإجابة --</option>` + rightOptions.map(o => `<option value="${o}">${o}</option>`).join('');
                row.innerHTML = `<div class="aq-match-left">${pair.left}</div><div class="aq-match-right"></div>`;
                row.querySelector('.aq-match-right').appendChild(selectBox);
                container.appendChild(row);
            });
            area.appendChild(container);
            const submitBtn = document.createElement('button');
            submitBtn.className = 'aq-submit-btn';
            submitBtn.innerHTML = '<i class="fas fa-link"></i> تأكيد المطابقة | Check Matches';
            submitBtn.onclick = () => {
                const selects = container.querySelectorAll('.aq-match-select');
                const userAns = Array.from(selects).map(s => s.value);
                processComplexAnswer(userAns, submitBtn, container, q);
            };
            area.appendChild(submitBtn);
        } else if (currentType === 'case-study' || currentType === 'simulation') {
            if (q.context) {
                const ctxBox = document.createElement('div');
                ctxBox.className = 'aq-context-box';
                ctxBox.innerHTML = `<h4>💡 سياق الحالة | Context</h4>${q.context}`;
                area.appendChild(ctxBox);
            }
            if (q.subQuestions) {
                const subBox = document.createElement('div');
                subBox.className = 'aq-sub-qs';
                subBox.innerHTML = q.subQuestions.map(sq => `<p>📍 ${sq}</p>`).join('');
                area.appendChild(subBox);
            }
            const textarea = document.createElement('textarea');
            textarea.className = 'aq-textarea';
            textarea.placeholder = currentType === 'simulation' ? 'اكتب نتيجة إجراءك هنا... | Simulation output or action...' : 'اكتب تحليلك هنا... | Your analysis...';
            area.appendChild(textarea);
            const submitBtn = document.createElement('button');
            submitBtn.className = 'aq-submit-btn';
            submitBtn.innerHTML = currentType === 'simulation' ? `<i class="fas fa-bolt"></i> ${q.actionBtnText || 'Run Simulation'}` : '<i class="fas fa-search"></i> تقديم التحليل | Submit Analysis';
            submitBtn.onclick = () => processComplexAnswer(textarea.value.trim(), submitBtn, textarea, q);
            area.appendChild(submitBtn);
        }

        startTimer();

        const card = document.getElementById('aq-question-card');
        card.classList.remove('slide-in');
        void card.offsetWidth;
        card.classList.add('slide-in');

    // â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
    // Select answer
    // â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
    // ─────────────────────────────────────────────
    // Select MCQ answer
    // ─────────────────────────────────────────────
    function selectAnswer(index, btn, container, q) {
        if (state.answered) return;
        state.answered = true;
        clearInterval(state.timerInterval);
        document.getElementById('aq-skip-btn').disabled = true;

        const isCorrect = index === q.correctAnswer;

        container.querySelectorAll('.aq-option-btn').forEach((b, i) => {
            b.classList.add('disabled');
            if (i === q.correctAnswer) b.classList.add('correct-opt');
            if (i === index && !isCorrect) b.classList.add('wrong-opt');
        });

        finishAnswer(isCorrect, index, q);
        showFeedback(isCorrect, q);
        setTimeout(() => showAITutor(state.currentIndex, isCorrect, q), 600);
        document.getElementById('aq-next-btn').disabled = false;
    }

    // ─────────────────────────────────────────────
    // Process Complex Types (Coding, Essay, etc.)
    // ─────────────────────────────────────────────
    function processComplexAnswer(userAns, btn, container, q) {
        if (state.answered) return;
        state.answered = true;
        clearInterval(state.timerInterval);
        document.getElementById('aq-skip-btn').disabled = true;
        if (btn) btn.disabled = true;
        if (container && container.disabled !== undefined) container.disabled = true;

        let isCorrect = true; 
        if (q.type === 'fill-blank' && typeof q.correctAnswer === 'string') {
            isCorrect = userAns.toLowerCase() === q.correctAnswer.toLowerCase();
        }

        finishAnswer(isCorrect, userAns, q);
        
        const fb = document.getElementById('aq-feedback');
        fb.className = 'aq-feedback fb-correct'; 
        document.getElementById('aq-feedback-icon').innerHTML = '<i class="fas fa-robot"></i>';
        document.getElementById('aq-feedback-title').textContent = '🤖 جاري تحليل الإجابة | AI Analyzing...';
        document.getElementById('aq-feedback-text').textContent = 'The AI Tutor is comparing your answer to the perfect solution.';
        fb.style.display = 'flex';
        fb.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        
        setTimeout(() => showAITutorComplex(q.correctAnswer, userAns, q), 1200);
        document.getElementById('aq-next-btn').disabled = false;
    }

    function finishAnswer(isCorrect, userAns, q) {
        if (isCorrect) {
            state.score++;
            state.streak++;
            state.maxStreak = Math.max(state.maxStreak, state.streak);
            state.correctStreak++;
            state.wrongStreak = 0;
            let earned = xpPerAnswer.correct;
            if (state.streak >= 3) earned += xpPerAnswer.streak3;
            if (state.streak >= 5) earned += xpPerAnswer.streak5;
            state.xp += earned;
            showXPPop(earned);
            if (state.correctStreak >= 3) { state.difficultyLevel = Math.min(4, state.difficultyLevel + 1); state.correctStreak = 0; }
        } else {
            state.streak = 0;
            state.wrongStreak++;
            state.correctStreak = 0;
            if (state.wrongStreak >= 2) { state.difficultyLevel = Math.max(1, state.difficultyLevel - 1); state.wrongStreak = 0; }
        }

        state.userAnswers.push({
            questionIndex: state.currentIndex,
            question: q.question,
            options: q.options || [],
            userAnswer: userAns,
            correctAnswer: q.correctAnswer,
            isCorrect,
            topic: q.topic || 'virtual-env'
        });
    }

    // â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
    // Feedback (bilingual)
    // â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
    function showFeedback(isCorrect, q) {
        const fb = document.getElementById('aq-feedback');
        const icon = document.getElementById('aq-feedback-icon');
        const title = document.getElementById('aq-feedback-title');
        const text = document.getElementById('aq-feedback-text');

        fb.className = 'aq-feedback ' + (isCorrect ? 'fb-correct' : 'fb-wrong');
        icon.innerHTML = isCorrect ? '<i class="fas fa-check-circle"></i>' : '<i class="fas fa-times-circle"></i>';

        if (isCorrect) {
            title.textContent = '✅ ممتاز! Correct! Well done!';
            text.textContent = `أحسنت! 🔥 سلسلة ${state.streak} إجابات صحيحة! | Great! You're on a ${state.streak} question streak!`;
        } else {
            title.textContent = '❌ إجابة خاطئة | Incorrect — لنتعلم من هذا!';
            text.textContent = `الإجابة الصحيحة هي | Correct answer: "${q.options[q.correctAnswer]}"`;
        }

        fb.style.display = 'flex';
        fb.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    // â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
    // AI Tutor (bilingual typing effect)
    // â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
    function showAITutor(qIndex, isCorrect, q) {
        const tutor = document.getElementById('aq-ai-tutor');
        const msg = document.getElementById('ai-tutor-message');
        const typingLabel = document.getElementById('ai-typing-label');
        const stepsContainer = document.getElementById('ai-step-by-step');
        const stepsList = document.getElementById('ai-steps-list');
        const stepTitle = stepsContainer.querySelector('h5');

        tutor.style.display = 'block';
        typingLabel.textContent = '🤖 المعلم الذكي يفكر... | AI Tutor is thinking...';
        msg.textContent = '';
        stepsContainer.style.display = 'none';
        if (stepTitle) stepTitle.innerHTML = '<i class="fas fa-list-ol"></i> خطوات التفسير | Step-by-Step Explanation';

        const explanation = getExplanation(q, qIndex);

        const prefix = isCorrect
            ? '✅ إجابة صحيحة! | Correct! '
            : '📌 تفسير الإجابة الصحيحة | Explanation: ';

        const fullMsg = prefix + explanation.message;

        let i = 0;
        typingLabel.textContent = '⌨️ يكتب... | Typing...';

        const typeInterval = setInterval(() => {
            msg.textContent += fullMsg[i];
            i++;
            if (i >= fullMsg.length) {
                clearInterval(typeInterval);
                typingLabel.textContent = '🤖 المعلم الذكي | AI Tutor';

                if (explanation.steps) {
                    stepsContainer.style.display = 'block';
                    stepsList.innerHTML = explanation.steps.map(s =>
                        `<li style="margin-bottom:6px;line-height:1.7">${s}</li>`
                    ).join('');
                }
            }
        }, 14);

        tutor.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    // â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
    // Hint (bilingual)
    // â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
    function showHint() {
        const hintBox = document.getElementById('aq-hint-box');
        hintBox.style.display = 'flex';
        document.getElementById('aq-hint-btn').style.display = 'none';
        state.hintsUsed++;
    }

    // ─────────────────────────────────────────────
    // AI Tutor for complex dynamic question types
    // ─────────────────────────────────────────────
    function showAITutorComplex(correctAnswer, userAnswer, q) {
        const tutor = document.getElementById('aq-ai-tutor');
        const msg = document.getElementById('ai-tutor-message');
        const typingLabel = document.getElementById('ai-typing-label');
        const stepsContainer = document.getElementById('ai-step-by-step');
        const stepsList = document.getElementById('ai-steps-list');
        const stepTitle = stepsContainer.querySelector('h5');       

        tutor.style.display = 'block';
        typingLabel.textContent = '🤖 المعلم الذكي يحلل إجابتك... | AI Tutor is analyzing...';
        msg.textContent = '';
        stepsContainer.style.display = 'none';

        if (stepTitle) stepTitle.innerHTML = '<i class="fas fa-check-circle"></i> الإجابة النموذجية | Perfect Answer';

        // Format correct answer nicely if it's an array
        let perfectAnsText = Array.isArray(correctAnswer) ? '<br>• ' + correctAnswer.join('<br>• ') : correctAnswer;
        if(q.type === 'coding') perfectAnsText = `<pre style="background:#0d0f1a;padding:10px;border-radius:8px;color:#00ff00;direction:ltr;margin-top:10px;">${correctAnswer}</pre>`;

        const mainMsg = `لقد قمت بتحليل تفاصيل استجابتك. بناءً على معايير نظامنا، إليك الإجابة النموذجية المثالية (Perfect Answer) مقارنةً بما قدمته: | I've analyzed your details. based on our criteria, here is the perfect answer:`;
        
        let i = 0;
        typingLabel.textContent = '⌨️ يكتب التحليل... | Typing analysis...';

        const typeInterval = setInterval(() => {
            msg.textContent += mainMsg[i];
            i++;
            if (i >= mainMsg.length) {
                clearInterval(typeInterval);
                typingLabel.textContent = '🤖 المعلم الذكي | AI Tutor';

                stepsContainer.style.display = 'block';
                stepsList.innerHTML = `<li style="margin-bottom:6px;line-height:1.7;font-weight:bold;color:#22c55e;">${perfectAnsText}</li>`;
            }
        }, 14);

        tutor.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    function skipQuestion() {
        if (state.answered) return;
        clearInterval(state.timerInterval);
        state.streak = 0;
        state.skipsUsed++;
        const q = state.questions[state.currentIndex];
        state.userAnswers.push({
            questionIndex: state.currentIndex,
            question: q.question,
            options: q.options || [],
            userAnswer: null,
            correctAnswer: q.correctAnswer,
            isCorrect: false,
            topic: q.topic || 'virtual-env'
        });
        state.currentIndex++;
        loadQuestion();
    }

    function nextQuestion() {
        state.currentIndex++;
        loadQuestion();
    }

    function startTimer() {
        const totalTime = config.timer === 0 ? 999 : (config.timer || 30);
        let timeLeft = totalTime;
        document.getElementById('timer-seconds').textContent = totalTime === 999 ? 'âˆž' : totalTime;
        const ring = document.getElementById('timer-ring-fill');
        const circumference = 94;
        ring.style.strokeDashoffset = '0';
        ring.style.stroke = '#6c63ff';
        if (totalTime === 999) return;

        clearInterval(state.timerInterval);
        state.timerInterval = setInterval(() => {
            timeLeft--;
            document.getElementById('timer-seconds').textContent = timeLeft;
            const offset = circumference - (timeLeft / totalTime) * circumference;
            ring.style.strokeDashoffset = offset;
            if (timeLeft <= 10) ring.style.stroke = '#ef4444';
            else if (timeLeft <= 20) ring.style.stroke = '#f7931e';

            if (timeLeft <= 0) {
                clearInterval(state.timerInterval);
                if (!state.answered) {
                    const q = state.questions[state.currentIndex];
                    state.streak = 0;
                    state.userAnswers.push({ questionIndex: state.currentIndex, question: q.question, options: q.options, userAnswer: null, correctAnswer: q.correctAnswer, isCorrect: false, topic: q.topic || 'virtual-env' });
                    document.getElementById('aq-question-card').querySelectorAll('.aq-option-btn').forEach(b => b.classList.add('disabled'));
                    const fb = document.getElementById('aq-feedback');
                    fb.className = 'aq-feedback fb-timeout';
                    document.getElementById('aq-feedback-icon').innerHTML = '<i class="fas fa-hourglass-end"></i>';
                    document.getElementById('aq-feedback-title').textContent = '⏱️ انتهى الوقت! | Time\'s Up!';
                    document.getElementById('aq-feedback-text').textContent = 'الإجابة الصحيحة | Correct answer: "' + q.options[q.correctAnswer] + '"';
                    fb.style.display = 'flex';
                    state.answered = true;
                    document.getElementById('aq-next-btn').disabled = false;
                    setTimeout(() => showAITutor(state.currentIndex, false, q), 600);
                }
            }
        }, 1000);
    }

    function showXPPop(amount) {
        const pop = document.getElementById('xp-pop');
        document.getElementById('xp-pop-val').textContent = amount;
        pop.style.display = 'block';
        pop.style.opacity = '1';
        pop.style.transform = 'translateX(-50%) translateY(0)';
        setTimeout(() => {
            pop.style.opacity = '0';
            pop.style.transform = 'translateX(-50%) translateY(-40px)';
            setTimeout(() => pop.style.display = 'none', 400);
        }, 800);
    }

    function endQuiz() {
        clearInterval(state.timerInterval);
        const timeTaken = Math.round((Date.now() - state.sessionStart) / 1000);
        const user = JSON.parse(localStorage.getItem('eduai_current_user') || '{}');
        user.xp = (user.xp || 0) + state.xp;
        user.streak = Math.max(user.streak || 0, state.streak);
        if (!user.badges) user.badges = [];
        if (state.score === state.questions.length && !user.badges.includes('perfect')) user.badges.push('perfect');
        if (state.maxStreak >= 5 && !user.badges.includes('streak_5')) user.badges.push('streak_5');
        localStorage.setItem('eduai_current_user', JSON.stringify(user));

        const results = {
            studentName: user.name || 'Student',
            studentCode: user.email || 'â€”',
            score: state.score,
            totalQuestions: state.questions.length,
            userAnswers: state.userAnswers,
            xpEarned: state.xp,
            maxStreak: state.maxStreak,
            timeTaken,
            hintsUsed: state.hintsUsed,
            skipsUsed: state.skipsUsed,
            adaptiveMode: true
        };
        sessionStorage.setItem('quizResults', JSON.stringify(results));
        localStorage.setItem('latestQuizResults', JSON.stringify(results));
        setTimeout(() => { window.location.href = 'results.html'; }, 300);
    }

    function confirmExit() { document.getElementById('exit-modal').style.display = 'flex'; }
    function exitToQuiz() { clearInterval(state.timerInterval); window.location.href = 'dashboard.html'; }

    // Boot
    prepareQuestions();
    loadQuestion();

    window.addEventListener('beforeunload', (e) => {
        if (state.currentIndex > 0 && state.currentIndex < state.questions.length) {
            e.preventDefault(); e.returnValue = '';
        }
    });
    </script>
