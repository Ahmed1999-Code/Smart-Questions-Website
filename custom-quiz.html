<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Exam – EduAI Pro</title>
    <meta name="description" content="Run your custom field exam with administrator-configured questions.">
    <link rel="stylesheet" href="platform.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh;
            background: var(--bg, #0d0f1a);
            font-family: 'Inter', sans-serif;
            color: var(--text, #e8eaf0);
            display: flex; flex-direction: column;
        }

        /* ---- Top Nav ---- */
        .cq-nav {
            position: fixed; top: 0; left: 0; right: 0; z-index: 100;
            background: rgba(13,15,26,0.97); backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255,255,255,0.07);
            padding: 0 24px; height: 58px;
            display: flex; align-items: center; gap: 12px;
        }
        .cq-nav-brand { display: flex; align-items: center; gap: 8px; text-decoration: none; color: var(--text,#e8eaf0); font-weight: 800; font-size: 0.95rem; }
        .cq-nav-icon { width: 30px; height: 30px; border-radius: 8px; background: linear-gradient(135deg,#6c63ff,#a855f7); display: flex; align-items: center; justify-content: center; color: #fff; font-size: 0.78rem; }
        .cq-field-badge { padding: 3px 10px; border-radius: 16px; background: rgba(108,99,255,0.13); border: 1px solid rgba(108,99,255,0.28); color: #a78bfa; font-size: 0.75rem; font-weight: 700; }
        .cq-nav-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
        .cq-progress-text { font-size: 0.8rem; font-weight: 700; color: #9ba3c0; }
        .cq-timer-badge {
            padding: 5px 12px; border-radius: 8px; font-size: 0.82rem; font-weight: 800;
            background: rgba(247,147,30,0.1); border: 1px solid rgba(247,147,30,0.25); color: #f7931e;
            display: flex; align-items: center; gap: 6px;
        }
        .cq-timer-badge.urgent { background: rgba(239,68,68,0.15); border-color: rgba(239,68,68,0.35); color: #ef4444; animation: pulse-red 0.8s infinite; }
        @keyframes pulse-red { 0%,100%{opacity:1} 50%{opacity:0.6} }

        /* ---- Progress Bar ---- */
        .cq-progress-bar-wrap { position: fixed; top: 58px; left: 0; right: 0; height: 4px; background: rgba(255,255,255,0.06); z-index: 99; }
        .cq-progress-bar-fill { height: 100%; background: linear-gradient(90deg,#6c63ff,#a855f7); transition: width 0.4s ease; }

        /* ---- Main ---- */
        .cq-main {
            flex: 1; display: flex; align-items: center; justify-content: center;
            padding: 80px 20px 20px; min-height: 100vh;
        }
        .cq-card {
            background: var(--card,#1a1c2e);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 22px; padding: 36px 32px;
            max-width: 700px; width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            position: relative; overflow: hidden;
        }
        .cq-card::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px;
            background: linear-gradient(90deg,#6c63ff,#a855f7);
        }

        /* Question Info Row */
        .cq-q-info { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
        .cq-q-badge {
            padding: 4px 12px; border-radius: 20px;
            background: rgba(108,99,255,0.13); border: 1px solid rgba(108,99,255,0.25);
            color: #a78bfa; font-size: 0.75rem; font-weight: 700;
            display: flex; align-items: center; gap: 6px;
        }
        .cq-q-num { font-size: 0.82rem; color: #9ba3c0; font-weight: 600; }

        /* Question Text */
        .cq-question {
            font-size: 1.18rem; font-weight: 700; line-height: 1.6;
            color: var(--text,#e8eaf0); margin-bottom: 24px;
            padding: 18px 20px; border-radius: 12px;
            background: rgba(108,99,255,0.07); border-left: 3px solid #6c63ff;
        }

        /* Options */
        .cq-options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 24px; }
        .cq-option {
            display: flex; align-items: center; gap: 14px;
            padding: 14px 18px; border-radius: 12px;
            background: rgba(255,255,255,0.04); border: 1.5px solid rgba(255,255,255,0.08);
            cursor: pointer; transition: all 0.2s; user-select: none;
        }
        .cq-option:hover:not(.locked) { background: rgba(108,99,255,0.1); border-color: rgba(108,99,255,0.4); transform: translateX(4px); }
        .cq-option.selected { background: rgba(108,99,255,0.14); border-color: #6c63ff; }
        .cq-option.correct { background: rgba(16,185,129,0.12); border-color: #10b981; }
        .cq-option.wrong { background: rgba(239,68,68,0.1); border-color: #ef4444; }
        .cq-option.locked { cursor: default; }
        .cq-opt-letter {
            width: 34px; height: 34px; flex-shrink: 0; border-radius: 10px;
            background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1);
            display: flex; align-items: center; justify-content: center;
            font-weight: 800; font-size: 0.85rem; color: #9ba3c0;
            transition: all 0.2s;
        }
        .cq-option.selected .cq-opt-letter { background: #6c63ff; border-color: #6c63ff; color: #fff; }
        .cq-option.correct .cq-opt-letter { background: #10b981; border-color: #10b981; color: #fff; }
        .cq-option.wrong .cq-opt-letter { background: #ef4444; border-color: #ef4444; color: #fff; }
        .cq-opt-text { font-size: 0.93rem; color: var(--text,#e8eaf0); flex: 1; }
        .cq-opt-icon { font-size: 1rem; }

        /* Feedback box */
        .cq-feedback {
            margin-bottom: 20px; padding: 14px 16px; border-radius: 12px;
            font-size: 0.88rem; line-height: 1.5; display: none;
            align-items: flex-start; gap: 10px;
        }
        .cq-feedback.correct-fb { background: rgba(16,185,129,0.1); border: 1px solid rgba(16,185,129,0.25); color: #10b981; display: flex; }
        .cq-feedback.wrong-fb { background: rgba(239,68,68,0.08); border: 1px solid rgba(239,68,68,0.2); color: #ef4444; display: flex; }
        .cq-feedback i { font-size: 1.1rem; flex-shrink: 0; margin-top: 2px; }

        /* Next Button */
        .cq-next-btn {
            width: 100%; padding: 14px; border-radius: 12px;
            background: linear-gradient(135deg,#6c63ff,#a855f7);
            color: #fff; font-size: 1rem; font-weight: 800;
            border: none; cursor: pointer; font-family: 'Inter',sans-serif;
            display: flex; align-items: center; justify-content: center; gap: 10px;
            transition: all 0.2s; box-shadow: 0 4px 16px rgba(108,99,255,0.4);
        }
        .cq-next-btn:disabled { opacity: 0.35; cursor: not-allowed; box-shadow: none; }
        .cq-next-btn:not(:disabled):hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(108,99,255,0.55); }

        /* XP widget */
        .cq-xp-widget {
            position: fixed; bottom: 24px; right: 20px;
            background: var(--card,#1a1c2e); border: 1px solid rgba(255,255,255,0.08);
            border-radius: 14px; padding: 12px 16px;
            display: flex; align-items: center; gap: 10px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
        }
        .cq-xp-val { font-size: 0.85rem; font-weight: 800; color: #e8eaf0; }
        .cq-xp-label { font-size: 0.72rem; color: #9ba3c0; }
        .cq-streak-val { color: #f7931e; font-weight: 800; font-size: 0.85rem; border-left: 1px solid rgba(255,255,255,0.08); padding-left: 10px; }

        /* ---- Results Screen ---- */
        .cq-results {
            display: none; flex-direction: column; align-items: center;
            text-align: center; padding: 20px 0;
        }
        .cq-results-icon {
            width: 80px; height: 80px; border-radius: 50%; margin: 0 auto 20px;
            display: flex; align-items: center; justify-content: center; font-size: 2rem; color: #fff;
        }
        .cq-results-icon.pass { background: linear-gradient(135deg,#10b981,#06d6a0); box-shadow: 0 10px 30px rgba(16,185,129,0.4); }
        .cq-results-icon.fail { background: linear-gradient(135deg,#ef4444,#f97316); box-shadow: 0 10px 30px rgba(239,68,68,0.4); }
        .cq-results h2 { font-family: 'Space Grotesk',sans-serif; font-size: 1.8rem; font-weight: 800; margin: 0 0 8px; }
        .cq-results-score { font-size: 3.5rem; font-weight: 900; font-family: 'Space Grotesk',sans-serif; margin: 10px 0; }
        .cq-results-score span { background: linear-gradient(135deg,#6c63ff,#a855f7); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .cq-results-sub { color: #9ba3c0; font-size: 0.92rem; margin-bottom: 28px; }
        .cq-results-stats { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; margin-bottom: 28px; }
        .cq-res-stat { padding: 14px 20px; border-radius: 12px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); }
        .cq-res-stat strong { display: block; font-size: 1.4rem; font-weight: 800; color: var(--text,#e8eaf0); }
        .cq-res-stat span { font-size: 0.78rem; color: #9ba3c0; }
        .cq-results-actions { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
        .cq-btn-retake, .cq-btn-dash {
            padding: 12px 24px; border-radius: 10px; font-size: 0.9rem; font-weight: 700;
            cursor: pointer; font-family: 'Inter',sans-serif; display: flex; align-items: center; gap: 8px; transition: all 0.2s;
        }
        .cq-btn-retake { background: linear-gradient(135deg,#6c63ff,#a855f7); color: #fff; border: none; box-shadow: 0 4px 14px rgba(108,99,255,0.4); }
        .cq-btn-retake:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(108,99,255,0.5); }
        .cq-btn-dash { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: #9ba3c0; }
        .cq-btn-dash:hover { color: #e8eaf0; background: rgba(255,255,255,0.1); }

        @media (max-width: 600px) {
            .cq-card { padding: 22px 16px; }
            .cq-question { font-size: 1rem; }
        }
    </style>
</head>
<body>

    <!-- Nav -->
    <nav class="cq-nav">
        <a href="dashboard.html" class="cq-nav-brand">
            <div class="cq-nav-icon"><i class="fas fa-brain"></i></div>
            EduAI Pro
        </a>
        <span class="cq-field-badge" id="cq-field-badge">Custom Exam</span>
        <div class="cq-nav-right">
            <span class="cq-progress-text" id="cq-progress-text">Q 1 of —</span>
            <div class="cq-timer-badge" id="cq-timer-badge"><i class="fas fa-clock"></i><span id="cq-timer-val">—</span></div>
        </div>
    </nav>

    <!-- Progress Bar -->
    <div class="cq-progress-bar-wrap"><div class="cq-progress-bar-fill" id="cq-progress-bar" style="width:0%"></div></div>

    <!-- Main -->
    <main class="cq-main">
        <div class="cq-card" id="cq-card">
            <!-- Quiz UI -->
            <div id="cq-quiz-ui">
                <div class="cq-q-info">
                    <div class="cq-q-badge" id="cq-q-badge"><i class="fas fa-graduation-cap"></i> <span id="cq-field-tag">Field</span></div>
                    <span class="cq-q-num" id="cq-q-num">Question 1</span>
                </div>
                <div class="cq-question" id="cq-question-text">Loading...</div>
                <div class="cq-options" id="cq-options"></div>
                <div class="cq-feedback" id="cq-feedback"><i id="cq-fb-icon" class="fas fa-check-circle"></i><span id="cq-fb-text"></span></div>
                <button class="cq-next-btn" id="cq-next-btn" disabled onclick="nextQuestion()">
                    <span id="cq-next-label">Next Question</span>
                    <i class="fas fa-chevron-right"></i>
                </button>
            </div>

            <!-- Results UI -->
            <div class="cq-results" id="cq-results">
                <div class="cq-results-icon" id="cq-results-icon"><i class="fas fa-trophy"></i></div>
                <h2 id="cq-results-title">Exam Complete!</h2>
                <div class="cq-results-score"><span id="cq-score-pct">0%</span></div>
                <p class="cq-results-sub" id="cq-results-sub">—</p>
                <div class="cq-results-stats">
                    <div class="cq-res-stat"><strong id="rs-correct">0</strong><span>Correct</span></div>
                    <div class="cq-res-stat"><strong id="rs-wrong">0</strong><span>Wrong</span></div>
                    <div class="cq-res-stat"><strong id="rs-xp">0</strong><span>XP Earned</span></div>
                    <div class="cq-res-stat"><strong id="rs-time">0s</strong><span>Total Time</span></div>
                </div>
                <div class="cq-results-actions">
                    <button class="cq-btn-retake" onclick="retakeExam()"><i class="fas fa-redo"></i> Retake Exam</button>
                    <button class="cq-btn-dash" onclick="window.location.href='question-feed.html'"><i class="fas fa-edit"></i> Edit Questions</button>
                    <button class="cq-btn-dash" onclick="window.location.href='dashboard.html'"><i class="fas fa-th-large"></i> Dashboard</button>
                </div>
            </div>
        </div>
    </main>

    <!-- XP Widget -->
    <div class="cq-xp-widget" id="cq-xp-widget">
        <div><div class="cq-xp-val"><span id="live-xp">0</span> XP</div><div class="cq-xp-label">This exam</div></div>
        <div class="cq-streak-val"><i class="fas fa-fire"></i> <span id="live-streak">0</span></div>
    </div>

    <script src="platform.js"></script>
    <script>
    // ---- Load Questions (per-user from localStorage, fallback sessionStorage) ----
    function getQuestionsForUser() {
        try {
            const user = JSON.parse(localStorage.getItem('eduai_current_user') || '{}');
            const email = (user.email || '').toLowerCase().trim();
            if (email) {
                const stored = localStorage.getItem('eduai_questions_' + email);
                if (stored) return JSON.parse(stored);
            }
        } catch(e) {}
        // fallback to sessionStorage
        const sess = sessionStorage.getItem('customQuestions');
        return sess ? JSON.parse(sess) : [];
    }

    function getFieldForUser() {
        try {
            const user = JSON.parse(localStorage.getItem('eduai_current_user') || '{}');
            const email = (user.email || '').toLowerCase().trim();
            if (email) {
                const f = localStorage.getItem('eduai_field_' + email);
                if (f) return f;
            }
        } catch(e) {}
        return sessionStorage.getItem('questionField') || 'Custom';
    }

    const customQs = getQuestionsForUser();
    const field = getFieldForUser();

    if (!customQs.length) {
        // No questions configured — send back to feed page
        document.body.innerHTML = `
            <div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0d0f1a;font-family:'Inter',sans-serif;gap:20px;padding:24px;text-align:center;">
                <div style="width:72px;height:72px;border-radius:20px;background:linear-gradient(135deg,#6c63ff,#a855f7);display:flex;align-items:center;justify-content:center;font-size:1.8rem;color:#fff;"><i class="fas fa-sliders-h"></i></div>
                <h2 style="color:#e8eaf0;font-size:1.5rem;margin:0;">No Questions Configured</h2>
                <p style="color:#9ba3c0;max-width:380px;margin:0;">Your account has no exam questions set up yet. Go to the Dashboard → <strong style="color:#a78bfa;">Specify Question Type</strong> to configure your question bank.</p>
                <a href="dashboard.html" style="padding:12px 28px;border-radius:10px;background:linear-gradient(135deg,#6c63ff,#a855f7);color:#fff;font-weight:700;text-decoration:none;font-size:0.95rem;"><i class="fas fa-th-large"></i> Go to Dashboard</a>
            </div>`;
    }

    document.getElementById('cq-field-badge').textContent = field;
    document.getElementById('cq-field-tag').textContent = field;

    // ---- Load exam settings ----
    const examSettings = JSON.parse(sessionStorage.getItem('examSettings') || '{}');
    const TIMER_SEC = examSettings.timePerQuestion || 60;
    const PASS_SCORE = examSettings.passScore || 50;

    // ---- State ----
    let currentIdx = 0;
    let answered = false;
    let score = 0;
    let xp = 0;
    let streak = 0;
    let startTime = Date.now();
    let qStartTime = Date.now();
    let timerInterval = null;
    let timeLeft = TIMER_SEC;

    // ---- Render Question ----
    function renderQuestion() {
        const q = customQs[currentIdx];
        answered = false;
        timeLeft = TIMER_SEC;

        // Update nav
        document.getElementById('cq-progress-text').textContent = `Q ${currentIdx + 1} of ${customQs.length}`;
        document.getElementById('cq-q-num').textContent = `Question ${currentIdx + 1} of ${customQs.length}`;
        document.getElementById('cq-progress-bar').style.width = ((currentIdx / customQs.length) * 100) + '%';

        // Question text (strip field prefix for cleaner display)
        const qText = q.question.replace(/^\[.*?\]\s*/, '');
        document.getElementById('cq-question-text').textContent = qText;

        // Options
        const optEl = document.getElementById('cq-options');
        optEl.innerHTML = q.options.map((opt, i) => `
            <div class="cq-option" id="opt-${i}" onclick="selectAnswer(${i})">
                <div class="cq-opt-letter">${['A','B','C','D'][i]}</div>
                <span class="cq-opt-text">${opt}</span>
                <span class="cq-opt-icon" id="opt-icon-${i}"></span>
            </div>
        `).join('');

        // Feedback & button
        const fb = document.getElementById('cq-feedback');
        fb.className = 'cq-feedback';
        fb.style.display = 'none';
        document.getElementById('cq-next-btn').disabled = true;
        const isLast = currentIdx === customQs.length - 1;
        document.getElementById('cq-next-label').textContent = isLast ? 'Finish Exam' : 'Next Question';

        qStartTime = Date.now();
        startTimer();
    }

    // ---- Timer ----
    function startTimer() {
        clearInterval(timerInterval);
        updateTimerDisplay();
        timerInterval = setInterval(() => {
            timeLeft--;
            updateTimerDisplay();
            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                if (!answered) autoExpire();
            }
        }, 1000);
    }

    function updateTimerDisplay() {
        const el = document.getElementById('cq-timer-val');
        const badge = document.getElementById('cq-timer-badge');
        el.textContent = timeLeft + 's';
        if (timeLeft <= 10) badge.classList.add('urgent');
        else badge.classList.remove('urgent');
    }

    function autoExpire() {
        answered = true;
        // lock all, show correct
        document.querySelectorAll('.cq-option').forEach(o => o.classList.add('locked'));
        document.getElementById(`opt-${customQs[currentIdx].correctAnswer}`).classList.add('correct');
        document.getElementById(`opt-icon-${customQs[currentIdx].correctAnswer}`).innerHTML = '<i class="fas fa-check-circle" style="color:#10b981"></i>';
        streak = 0;
        showFeedback(false, "⏰ Time's up! The correct answer has been highlighted.");
        document.getElementById('cq-next-btn').disabled = false;
    }

    // ---- Select Answer ----
    function selectAnswer(idx) {
        if (answered) return;
        answered = true;
        clearInterval(timerInterval);

        const q = customQs[currentIdx];
        const isCorrect = idx === q.correctAnswer;

        // Highlight
        document.querySelectorAll('.cq-option').forEach(o => o.classList.add('locked'));
        const chosen = document.getElementById(`opt-${idx}`);
        const correct = document.getElementById(`opt-${q.correctAnswer}`);

        correct.classList.add('correct');
        document.getElementById(`opt-icon-${q.correctAnswer}`).innerHTML = '<i class="fas fa-check-circle" style="color:#10b981"></i>';

        if (isCorrect) {
            score++;
            streak++;
            xp += 10 + (streak >= 3 ? 5 : 0) + (streak >= 5 ? 10 : 0);
        } else {
            chosen.classList.add('wrong');
            document.getElementById(`opt-icon-${idx}`).innerHTML = '<i class="fas fa-times-circle" style="color:#ef4444"></i>';
            streak = 0;
        }

        document.getElementById('live-xp').textContent = xp;
        document.getElementById('live-streak').textContent = streak;

        showFeedback(isCorrect,
            isCorrect
                ? `✅ Correct! Well done — you're on a ${streak} answer streak!`
                : `❌ Incorrect. The correct answer is: "${q.options[q.correctAnswer]}"`
        );
        document.getElementById('cq-next-btn').disabled = false;
    }

    function showFeedback(isCorrect, msg) {
        const fb = document.getElementById('cq-feedback');
        fb.className = `cq-feedback ${isCorrect ? 'correct-fb' : 'wrong-fb'}`;
        fb.style.display = 'flex';
        document.getElementById('cq-fb-icon').className = `fas ${isCorrect ? 'fa-check-circle' : 'fa-times-circle'}`;
        document.getElementById('cq-fb-text').textContent = msg;
    }

    // ---- Next Question ----
    function nextQuestion() {
        currentIdx++;
        if (currentIdx >= customQs.length) {
            showResults();
        } else {
            renderQuestion();
        }
    }

    // ---- Results ----
    function showResults() {
        clearInterval(timerInterval);
        const totalTime = Math.round((Date.now() - startTime) / 1000);
        const pct = Math.round((score / customQs.length) * 100);
        const pass = pct >= PASS_SCORE;

        document.getElementById('cq-progress-bar').style.width = '100%';
        document.getElementById('cq-quiz-ui').style.display = 'none';
        document.getElementById('cq-xp-widget').style.display = 'none';

        const results = document.getElementById('cq-results');
        results.style.display = 'flex';

        const icon = document.getElementById('cq-results-icon');
        icon.className = `cq-results-icon ${pass ? 'pass' : 'fail'}`;
        icon.innerHTML = `<i class="fas ${pass ? 'fa-trophy' : 'fa-times'}"></i>`;

        document.getElementById('cq-results-title').textContent = pass ? 'Excellent Work!' : 'Keep Practising!';
        document.getElementById('cq-score-pct').textContent = pct + '%';
        document.getElementById('cq-results-sub').textContent = `You answered ${score} out of ${customQs.length} questions correctly in the ${field} exam.`;
        document.getElementById('rs-correct').textContent = score;
        document.getElementById('rs-wrong').textContent = customQs.length - score;
        document.getElementById('rs-xp').textContent = '+' + xp;
        document.getElementById('rs-time').textContent = totalTime < 60 ? totalTime + 's' : Math.round(totalTime/60) + 'm';

        // Save results
        try {
            const user = JSON.parse(localStorage.getItem('eduai_current_user') || '{}');
            user.xp = (user.xp || 0) + xp;
            localStorage.setItem('eduai_current_user', JSON.stringify(user));
            sessionStorage.setItem('latestQuizResults', JSON.stringify({ score, totalQuestions: customQs.length, timeTaken: totalTime, field }));
        } catch(e) {}
    }

    // ---- Retake ----
    function retakeExam() {
        currentIdx = 0; score = 0; xp = 0; streak = 0;
        startTime = Date.now();
        document.getElementById('cq-quiz-ui').style.display = 'block';
        document.getElementById('cq-xp-widget').style.display = 'flex';
        document.getElementById('cq-results').style.display = 'none';
        document.getElementById('live-xp').textContent = 0;
        document.getElementById('live-streak').textContent = 0;
        renderQuestion();
    }

    // ---- Start ----
    renderQuestion();
    </script>
</body>
</html>
