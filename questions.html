<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classic Quiz – EduAI Pro</title>
    <meta name="description" content="Classic quiz mode - answer all questions from the Python Virtual Environments question bank.">
    <link rel="stylesheet" href="platform.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* Platform banner for quiz page */
        .quiz-platform-banner {
            position: fixed; top: 0; left: 0; right: 0; z-index: 999;
            background: rgba(13,15,26,0.97); backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255,255,255,0.08);
            padding: 8px 20px; display: flex; align-items: center; gap: 12px;
            font-family: 'Inter', sans-serif;
        }
        .qpb-brand { display: flex; align-items: center; gap: 8px; text-decoration: none; color: #e8eaf0; font-weight: 800; font-size: 0.95rem; }
        .qpb-icon { width: 30px; height: 30px; border-radius: 8px; background: linear-gradient(135deg,#6c63ff,#a855f7); display: flex; align-items: center; justify-content: center; color: white; font-size: 0.8rem; }
        .qpb-badge { padding: 3px 9px; border-radius: 6px; background: rgba(108,99,255,0.12); border: 1px solid rgba(108,99,255,0.25); color: #6c63ff; font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
        .qpb-actions { display: flex; gap: 8px; margin-left: auto; align-items: center; }
        .qpb-btn { padding: 5px 12px; border-radius: 8px; font-size: 0.78rem; font-weight: 600; text-decoration: none; transition: all 0.2s; border: 1px solid rgba(255,255,255,0.1); color: #9ba3c0; background: none; cursor: pointer; display: flex; align-items: center; gap: 5px; }
        .qpb-btn:hover { color: #e8eaf0; background: rgba(255,255,255,0.06); }
        .qpb-btn.primary { background: linear-gradient(135deg,#6c63ff,#a855f7); color: white; border-color: transparent; box-shadow: 0 2px 8px rgba(108,99,255,0.3); }
        .qpb-btn.primary:hover { transform: translateY(-1px); box-shadow: 0 4px 14px rgba(108,99,255,0.45); }
        .quiz-platform-banner .theme-toggle { width: 30px; height: 30px; border-radius: 8px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); font-size: 0.8rem; }

        /* Push content below fixed banner */
        .quiz-page-wrap { padding-top: 50px; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding-bottom: 40px; }

        /* Style overrides for quiz screen inside our new platform shell */
        #quiz-screen {
            background: var(--card, #1e2035) !important;
            border: 1px solid var(--border, rgba(255,255,255,0.08)) !important;
        }
        .question-text {
            background: rgba(108,99,255,0.08) !important;
            border-left-color: #6c63ff !important;
            color: var(--text, #e8eaf0) !important;
        }
        .option-btn {
            background: var(--bg3, #22243a) !important;
            border-color: var(--border, rgba(255,255,255,0.08)) !important;
            color: var(--text, #e8eaf0) !important;
        }
        .option-btn:hover {
            border-color: #6c63ff !important;
            background: rgba(108,99,255,0.08) !important;
        }
        /* XP widget during quiz */
        .quiz-xp-widget {
            position: fixed; bottom: 24px; right: 24px; z-index: 200;
            background: var(--card, #1e2035); border: 1px solid var(--border, rgba(255,255,255,0.08));
            border-radius: 14px; padding: 12px 16px;
            display: flex; align-items: center; gap: 10px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
            font-family: 'Inter', sans-serif;
        }
        .quiz-xp-widget-icon { color: #6c63ff; font-size: 1rem; }
        .quiz-xp-widget-val { font-size: 0.85rem; font-weight: 700; color: #e8eaf0; }
        .quiz-xp-widget-label { font-size: 0.72rem; color: #9ba3c0; }
        .quiz-streak-widget { color: #f7931e; display: flex; align-items: center; gap: 4px; font-weight: 700; font-size: 0.85rem; border-left: 1px solid rgba(255,255,255,0.08); padding-left: 10px; }
    </style>
</head>
<body>

    <!-- Platform Banner -->
    <nav class="quiz-platform-banner">
        <a href="index.html" class="qpb-brand">
            <div class="qpb-icon"><i class="fas fa-brain"></i></div>
            EduAI Pro
        </a>
        <span class="qpb-badge">Classic Quiz</span>
        <div class="qpb-actions">
            <span id="qpb-question-display" style="font-size:0.78rem;color:#9ba3c0;font-weight:600;font-family:'Inter',sans-serif;"></span>
            <a href="dashboard.html" class="qpb-btn"><i class="fas fa-th-large"></i> Dashboard</a>
            <a href="adaptive-quiz.html" class="qpb-btn primary"><i class="fas fa-brain"></i> Try AI Mode</a>
            <button class="theme-toggle qpb-btn" id="theme-toggle" title="Toggle Dark/Light Mode">
                <i class="fas fa-moon" id="theme-icon"></i>
            </button>
        </div>
    </nav>

    <!-- Quiz Wrapper -->
    <div class="quiz-page-wrap">
        <div id="quiz-screen" class="screen active">
            <div class="header">
                <span id="student-info-display"></span>
                <span id="question-counter">Question 1/{{ total }}</span>
                <div id="timer-bar"><div id="timer-fill"></div></div>
            </div>
            <div id="question-container"></div>
            <button id="next-question-btn" disabled>
                Next Question <i class="fas fa-chevron-right"></i>
            </button>
        </div>
    </div>

    <!-- Live XP Widget -->
    <div class="quiz-xp-widget" id="quiz-xp-widget">
        <div class="quiz-xp-widget-icon"><i class="fas fa-bolt"></i></div>
        <div>
            <div class="quiz-xp-widget-val"><span id="live-xp">0</span> XP</div>
            <div class="quiz-xp-widget-label">Earned this session</div>
        </div>
        <div class="quiz-streak-widget">
            <i class="fas fa-fire"></i>
            <span id="live-streak">0</span>
        </div>
    </div>

    <script src="questions.js"></script>
    <script src="platform.js"></script>
    <script src="script.js"></script>
    <script>
        // Live XP tracking for classic quiz
        (function trackXP() {
            let xp = 0;
            let streak = 0;
            const origSelect = window.selectAnswer;

            // Patch selectAnswer if it exists
            if (typeof origSelect === 'function') {
                window.selectAnswer = function(index, container) {
                    const questionIndex = window.currentQuestionIndex || 0;
                    const q = window.quizQuestions ? window.quizQuestions[questionIndex] : null;
                    if (q && index === q.correctAnswer) {
                        streak++;
                        xp += 10;
                        if (streak >= 3) xp += 5;
                        if (streak >= 5) xp += 10;
                    } else {
                        streak = 0;
                    }
                    document.getElementById('live-xp').textContent = xp;
                    document.getElementById('live-streak').textContent = streak;
                    return origSelect.call(this, index, container);
                };
            }
        })();

        // Update question counter in banner
        const origLoad = window.loadQuestion;
        if (typeof origLoad === 'function') {
            window.loadQuestion = function() {
                const result = origLoad.call(this);
                const display = document.getElementById('qpb-question-display');
                if (display && window.quizQuestions) {
                    display.textContent = `Q ${(window.currentQuestionIndex || 0) + 1} of ${window.quizQuestions.length}`;
                }
                return result;
            };
        }
    </script>
</body>
</html>
